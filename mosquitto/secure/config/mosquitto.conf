# =====================================================================
# Configuration Mosquitto - VERSION SECURISEE v2 (TLS + auth + ACL)
# =====================================================================
# Ameliorations v2 par rapport a v1 :
#   - chiffrement TLS sur le port 8883 (defense en profondeur)
#   - certificats auto-signes generes par scripts/generate-certs.sh
#   - parametres anti-bruteforce (max_connections, message_size_limit)
#
# Resultat : meme un attaquant capable de sniffer le reseau (ex : sur
# un Wi-Fi public) ne peut plus voir les mots de passe ni les donnees.
# =====================================================================

# -----------------------------------------------
# Listener TLS sur le port standard 8883
# -----------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

# Certificats serveur (montes via docker-compose)
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Versions TLS modernes uniquement
tls_version tlsv1.2

# Pas d'authentification client par certificat (TLS serveur seulement,
# l'authentification client passe par username/password)
require_certificate false

# -----------------------------------------------
# Authentification + ACL
# -----------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file      /mosquitto/config/aclfile

# -----------------------------------------------
# Hardening anti-DoS / anti-bruteforce
# -----------------------------------------------
max_connections 50
max_inflight_messages 20
max_queued_messages 100
message_size_limit 8192

# -----------------------------------------------
# Persistence + logs
# -----------------------------------------------
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true
