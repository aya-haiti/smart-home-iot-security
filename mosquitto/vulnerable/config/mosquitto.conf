# =====================================================================
# Configuration Mosquitto - VERSION VULNERABLE (DEMONSTRATION UNIQUEMENT)
# =====================================================================
# ATTENTION : Cette configuration est volontairement non securisee.
# Elle sert uniquement a demontrer les risques d'un broker MQTT mal configure.
# Ne JAMAIS utiliser cette configuration en production.
# =====================================================================

# Listener sur le port 1883 ouvert a toutes les interfaces
listener 1883 0.0.0.0

# Acces anonyme autorise : n'importe qui peut se connecter sans authentification
allow_anonymous true

# Persistance des messages
persistence true
persistence_location /mosquitto/data/

# Logs (utile pour observer les attaques pendant la demo)
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
connection_messages true
log_timestamp true
